name: Publicar imagen y desplegar en Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publicar-y-desplegar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ansible-ubuntu-lab:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ansible-ubuntu-lab:${{ github.sha }}

      - name: Desplegar imagen en Render
        run: |
          curl --fail-with-body --show-error --request POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            --header "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data '{"imageUrl":"docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ansible-ubuntu-lab:${{ github.sha }}"}'