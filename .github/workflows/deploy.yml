name: Publicar imagen en Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publicar-imagen:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ansible-ubuntu-lab:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ansible-ubuntu-lab:${{ github.sha }}